name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Update the GitHub Pages branch
        shell: bash
        run: |
          set -euo pipefail
          touch dist/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          build_tree=$(git write-tree)
          build_commit=$(git commit-tree "$build_tree" -p HEAD -m 'Prepare Pages output')
          artifact_commit=$(git subtree split --prefix=dist "$build_commit")
          git push origin "$artifact_commit:refs/heads/gh-pages" --force
